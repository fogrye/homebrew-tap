name: Update Keywarden
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keywarden
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-cask.py
      - name: Publish cask update
        run: |
          if git diff --quiet -- Casks/keywarden.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/keywarden.rb
          git commit -m 'Update Keywarden to latest stable release'
          git push
